<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>로컬로</title>
<meta name="description" content="반값여행 지역의 신청 일정·식당·숙박·카페를 한 지도에서 보고 여행 경비와 환급액을 미리 계산하는 웹앱">
<meta name="theme-color" content="#fffdfa">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="로컬로">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="calendar.css?v=20261126a">
<link rel="stylesheet" href="styles.css?v=20261126w">
</head>
<body>
<script>document.body.dataset.sheet="peek"</script>
<header class="top">
  <div class="top-in">
    <button type="button" class="brand" data-logo aria-label="로컬로 · 첫 화면으로">
      <svg viewBox="40 20 370 490" aria-hidden="true"><path d="M48 38H212V272H92V458H232V502H48V228H168V82H48Z" fill="#2f5d50"/><path d="M208 28H402V482H358V262H228V218H358V72H208Z" fill="#7fa597"/></svg>
      로컬로
    </button>
    <nav class="nav" aria-label="주 메뉴">
      <button type="button" aria-current="page" data-tab="map">지역 지도</button>
      <button type="button" data-tab="calendar">축제 캘린더</button>
      <button type="button" data-tab="community">커뮤니티</button>
      <button type="button" data-soon="반값여행 안내">반값여행 안내</button>
    </nav>
    <span id="checked" hidden>-</span>
    <div class="top-actions">
      <button type="button" class="ibtn" data-tab="trip" aria-label="장바구니"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 8h14l-1.2 11a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="badge num" id="badge" hidden>0</span></button>
      <button type="button" class="ibtn desk" data-tab="my" aria-label="마이"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></svg></button>
    </div>
  </div>
</header>

<main class="shell">
  <aside class="panel left" id="sheet" aria-label="지역과 장소">
    <button class="sheet-handle" id="handle" type="button" aria-label="목록 펼치기"></button>
    <div class="p-scroll" id="left"></div>
  </aside>

  <section class="mapwrap" id="mapwrap" aria-label="반값여행 지역 지도">
    <svg class="map-svg" id="svg" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <g id="g-shadow" class="layer-fade"></g>
      <g id="g-prov" class="layer-fade"></g>
      <g id="g-munis" class="layer-fade"></g>
      <g id="g-targets" class="layer-fade"></g>
      <g id="g-deco" class="layer-fade"></g>
      <g id="g-route"></g>
      <path id="morph" class="morph" d=""/>
    </svg>
    <div class="overlay" id="overlay"></div>
    <div class="map-top" id="maptop"></div>
    <div class="map-foot">
            <div class="grow"></div>
      <span class="map-tip"><span class="mouse-tip">Ctrl + 휠로 확대·축소 · 확대 후 끌거나 휠로 이동 · 스페이스바를 누른 채 끌어도 이동</span><span class="touch-tip">두 손가락으로 확대·축소 · 확대한 지도를 밀어서 이동</span></span>
      <span class="credit">경계: 통계청 센서스용 행정구역경계</span>
    </div>
    <!-- 지도 확대(kangbj70-cell/Loc): −/+ 버튼, 가운데 숫자를 누르면 원래 크기 -->
    <p class="lod-note" id="lod-note" role="status" hidden></p>
    <div class="map-zoom" role="group" aria-label="지도 크기 조절">
      <button type="button" data-zoom="out" aria-label="지도 축소">−</button>
      <button type="button" class="zv" data-zoom="fit" aria-label="지도 원래 크기로" title="원래 크기로"><output id="zoomv" aria-live="off">100%</output></button>
      <button type="button" data-zoom="in" aria-label="지도 확대">+</button>
    </div>
    <div class="compass" aria-hidden="true"><span>N</span><span class="compass-needle"></span></div>
  </section>

  <!-- 장바구니: kangbj70-cell/Loc 의 여행 일정표 형태(여러 장바구니 · 방문 순서 · 접히는 경비 · 1인당 부담금).
       환급 계산은 localo 지역 규칙(data/regions.json), 저장은 Supabase 지난 여행 -->
  <aside class="panel right trip-panel" id="trip" aria-label="여행 일정표">
    <div class="trip-head"><span>장바구니</span><button type="button" data-tab="map">지도로</button></div>
    <nav class="cart-tabs" aria-label="장바구니 선택">
      <div id="basket-list"></div>
      <button class="add-basket" type="button" data-new-basket aria-label="새 장바구니 추가" title="새 장바구니 추가">+</button>
    </nav>
    <header class="trip-title-row">
      <div class="trip-title-text">
        <div class="trip-heading-line">
          <span class="trip-destination" id="trip-destination" hidden>
            <span class="trip-region-switch">
              <button type="button" id="clear-trip-region" data-trip-region-clear aria-label="지역 선택 해제" aria-describedby="trip-region-tip">
                <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8"/></svg>
              </button>
              <span role="tooltip" id="trip-region-tip">다른 지역은 어떨까?</span>
            </span>
            <span id="trip-region"></span>
          </span>
          <div class="trip-title-group" id="trip-title-group"></div>
        </div>
        <p id="trip-count"></p>
      </div>
      <button type="button" class="trip-close desk" data-tab="map" aria-label="일정표 닫기"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8"/></svg></button>
    </header>
    <div class="trip-layout p-scroll" id="trip-scroll">
      <section class="trip-places" aria-label="담은 장소"><div id="trip-items"></div></section>
      <div class="route" id="route"></div>
      <details class="trip-calculator" id="trip-calculator">
        <summary>여행 설정과 경비</summary>
        <section class="trip-settings" aria-labelledby="trip-settings-title">
          <h3 id="trip-settings-title">여행 설정</h3>
          <div class="form">
            <div class="field"><label for="d1">가는 날</label><input id="d1" type="date" value="2026-11-21"></div>
            <div class="field"><label for="d2">오는 날</label><input id="d2" type="date" value="2026-11-22"></div>
            <div class="field"><label id="pplLabel">인원</label>
              <div class="stepper" role="group" aria-labelledby="pplLabel"><button type="button" id="pm" aria-label="인원 줄이기">−</button><span class="num" id="pp">2명</span><button type="button" id="pl" aria-label="인원 늘리기">+</button></div>
            </div>
            <div class="field"><label id="modeLabel">지원 유형</label>
              <div class="seg" id="mode" role="group" aria-labelledby="modeLabel">
                <button type="button" data-m="normal" aria-pressed="true">일반</button>
                <button type="button" data-m="youth" aria-pressed="false">청년</button>
                <button type="button" data-m="family" aria-pressed="false">가족</button>
              </div>
            </div>
          </div>
        </section>
        <section class="trip-summary" id="sum" aria-label="예상 여행 경비" aria-live="polite"></section>
        <div class="cmp" id="cmp"></div>
      </details>
    </div>
    <footer class="trip-person-total">
      <div><strong>1인당 예상 부담금</strong><small id="split-count"></small></div>
      <output id="split-estimate" class="num" aria-live="polite">0원</output>
      <button class="save-trip" type="button" id="save-trip" data-save-trip disabled><span aria-hidden="true">♡</span> 찜!</button>
    </footer>
  </aside>
  <!-- Loc 가방 버튼: 누르면 일정표 서랍이 지도 위로 나온다 -->
  <button type="button" class="cart-fab" id="cart-fab" data-tab="trip" aria-label="여행 일정표 열기" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.5 9 4-5.5M17.5 9l-4-5.5M3 9h18l-1.6 9.3a2 2 0 0 1-2 1.7H6.6a2 2 0 0 1-2-1.7L3 9Z"/><path d="M9 12.3v4M15 12.3v4"/></svg><span class="cart-count num" id="fab-count" hidden>0</span></button>
  <div class="sr-only" id="cart-announcement" role="status"></div>

  <!-- 마이·커뮤니티: 휴대폰은 전체 화면, PC는 지도 위 창 -->
  <section class="page" id="page-my" aria-label="마이"><div class="page-head"><b>마이</b></div><div class="page-body" id="my"></div></section>
  <section class="page" id="page-community" aria-label="커뮤니티"><div class="page-head"><b>커뮤니티</b></div><div class="page-body" id="community"></div></section>
  <!-- 축제 캘린더(kangbj70-cell/Loc 화면): 신청·여행 기간은 data/regions.json, 행사는 예시 -->
  <section class="page page-wide" id="page-calendar" aria-label="축제 캘린더"><div class="page-head"><b>축제 캘린더</b><button type="button" data-tab="map">지도로</button></div><div class="page-body"><div class="secondary calendar-page" id="calendar"></div></div></section>
  <div class="page-dim" data-tab="map"></div>
</main>

<nav class="tabbar" aria-label="앱 메뉴">
  <button type="button" aria-current="page" data-tab="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>지도</button>
  <button type="button" data-tab="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>축제</button>
  <button type="button" data-tab="community"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 4v-4A2.5 2.5 0 0 1 4 13.5Z"/><path d="M8.5 9h7M8.5 12h4.5" stroke-linecap="round"/></svg>커뮤니티</button>
  <button type="button" data-tab="my"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></svg>마이</button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/flubber@0.4.2/build/flubber.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="cloud.js?v=20261117i"></script>
<script src="region-photos.js?v=20261126a"></script>
<script src="calendar.js?v=20261126c"></script>
<script src="app.js?v=20261126w"></script>
</body>
</html>
